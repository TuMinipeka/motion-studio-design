<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Motion Studio · plantilla</title>
<style>html, body { margin: 0; background: #0B0D10; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script src="lib.js"></script>
<!-- kit: cámara, transiciones, profundidad de campo, luz, partículas, escritura y textos.
     Ver references/kit.md, kit/ejemplo.html y kit/tecnicas.html. Quita los que no uses. -->
<script src="kit/camara.js"></script>
<script src="kit/transiciones.js"></script>
<script src="kit/profundidad.js"></script>
<script src="kit/luz.js"></script>
<script src="kit/particulas.js"></script>
<script src="kit/escritura.js"></script>
<script src="kit/textos.js"></script>
<script>
// PLANTILLA: reemplaza render(t) por el video real. Contrato (lo exige render.mjs):
//   · window.seek(t) dibuja el fotograma del instante t, sin leer nada que no sea t.
//   · window.ready = true cuando todo está cargado (fuentes, imágenes, modelos).
//   · si algo falla al cargar: window.loadError = 'mensaje'.
// Prohibido durante el render: transiciones CSS, setTimeout, requestAnimationFrame, Math.random, estado entre fotogramas.
(async () => {
  const cfg = await (await fetch('motion.config.json')).json();
  const W = cfg.video.ancho, H = cfg.video.alto;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // Una tipografía para títulos y otra para la interfaz: cárgalas aquí con FontFace desde assets/ o desde
  // /node_modules: las fuentes de preparar.py (inter, bebas-neue, permanent-marker… ver Paso 0 del SKILL.md) ya están ahí:
  //   const titulo = new FontFace('Titulo', 'url(/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)');
  //   await titulo.load(); document.fonts.add(titulo);
  await document.fonts.ready;
  // Todo texto pasa por texto()/numero() de lib.js: fillText directo bajo escala o rotación no es determinista.
  const { texto } = crearTexto(ctx);

  const ACENTO = '#2F6BFF';   // ejemplo técnico: reemplazar por la dirección aprobada

  // Un mismo sujeto se desplaza, despliega una estructura y la transforma.
  // No es un estilo final ni una plantilla de escenas para copiar a todos los videos.
  function sujeto(p) {
    const avance = easeInOutCubic(prog(p, 0.06, 0.64));
    return {
      x: lerp(W * 0.20, W * 0.73, avance),
      y: H * (0.54 - 0.14 * Math.sin(avance * Math.PI)),
      radio: H * (0.055 + 0.012 * Math.sin(avance * Math.PI)),
      apertura: easeInOutCubic(prog(p, 0.38, 0.70)),
      cierre: easeInOutCubic(prog(p, 0.78, 0.96))
    };
  }

  function render(t) {
    ctx.reset();   // el estado del contexto (lineCap, textAlign, font, transformación…) no pasa de un fotograma a otro
    ctx.fillStyle = '#0B0D10'; ctx.fillRect(0, 0, W, H);
    const p = clamp(t / cfg.video.duracion), s = sujeto(p);
    const abierto = s.apertura * (1 - s.cierre);
    // Las conexiones nacen del sujeto; sus extremos se calculan analíticamente para cada t.
    const nodos = [-1, 0, 1].map(i => ({
      x: s.x + W * 0.13 * abierto,
      y: s.y + H * 0.18 * i * abierto
    }));
    ctx.lineWidth = Math.max(2, H * 0.006); ctx.strokeStyle = '#F2F5FA';
    for (const n of nodos) {
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(n.x, n.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x, n.y, H * 0.021 * abierto, 0, Math.PI * 2); ctx.fillStyle = '#F2F5FA'; ctx.fill();
    }
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.cierre * Math.PI / 4);
    const r = s.radio, cuadrado = s.cierre;
    ctx.fillStyle = ACENTO; ctx.beginPath();
    ctx.roundRect(-r, -r, r * 2, r * 2, Math.max(1, r * (1 - cuadrado))); ctx.fill(); ctx.restore();
    texto('PLANTILLA TÉCNICA · reemplazar por la acción del brief', `500 ${Math.round(Math.max(12, H * 0.022))}px system-ui, sans-serif`,
      '#A9B4C0', Math.round(W * 0.05), Math.round(H * 0.91), { align: 'left' });
  }

  window.seek = t => render(t);
  window.seek(0);
  window.ready = true;
})().catch(e => { window.loadError = String(e && e.stack || e); });
</script>
