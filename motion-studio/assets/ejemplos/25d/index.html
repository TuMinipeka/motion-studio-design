<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Prueba 2.5D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17252b}canvas{display:block}</style>
<canvas id="lienzo"></canvas>
<script src="lib.js"></script><script src="kit/secuencia.js"></script><script src="kit/sincro.js"></script>
<script>
const ctx=document.getElementById('lienzo').getContext('2d');
const {texto}=crearTexto(ctx);
window.ready=false;
(async()=>{
  const leer=async url=>{const r=await fetch(url);if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.json();};
  const [cfg,recurso,datos]=await Promise.all([leer('motion.config.json'),leer('escena.recurso.json'),leer('sincro.json')]);
  const W=cfg.video.ancho,H=cfg.video.alto;ctx.canvas.width=W;ctx.canvas.height=H;
  const fuente=new FontFace('Archivo','url(/node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2)');
  await fuente.load();document.fonts.add(fuente);await document.fonts.ready;
  const secuencia=crearSecuencia({ruta:recurso.ruta,cantidad:recurso.cantidad,fps:recurso.fps,primero:recurso.primero,cache:3});
  const sincro=crearSincro(datos);
  window.seek=async t=>{
    const im=await secuencia.fotograma(t);
    ctx.reset();ctx.drawImage(im,0,0,W,H);
    const golpe=sincro.impacto('golpe');
    const rotulo=t<1.5?'CERRADA.':t>=golpe&&t<golpe+0.45?'¡CLONC!':t>=10/3?'SIGUE CERRADA.':'';
    if(rotulo)texto(rotulo,'72px Archivo','#fff5dd',W/2,H*0.13,{borde:8,colorBorde:'#17252b'});
  };
  await window.seek(0);window.ready=true;
})().catch(e=>{window.loadError=e.message;console.error(e);});
</script></html>
